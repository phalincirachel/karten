<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#ede7dc">
  <meta name="description" content="100 Karten zu Literatur, Philosophie, Geschichte, Kunst, Musik und Erzähltraditionen.">
  <title>Kartei</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://upload.wikimedia.org">
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f4f0e8;--card:#fffdf9;--ink:#191817;--muted:#69645d;--line:#d7d0c5;--accent:#8b2f28;--max:1240px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;-webkit-font-smoothing:antialiased}body.dialog-open{overflow:hidden}button,input{font:inherit}
    header{max-width:var(--max);margin:auto;padding:45px 20px 26px}h1{margin:0;font:600 clamp(42px,8vw,72px)/1 "Source Serif 4",serif}.count{margin:8px 0 0;color:var(--muted);font:14px "IBM Plex Sans",sans-serif}
    .controls{position:sticky;z-index:10;top:0;border-block:1px solid var(--line);background:rgba(244,240,232,.96);backdrop-filter:blur(12px)}.controls-inner{max-width:var(--max);margin:auto;padding:12px 20px}.search-row{display:flex;gap:8px}.search{width:100%;height:42px;border:1px solid #aaa298;border-radius:2px;background:#fffdf9;padding:0 12px;color:var(--ink);outline:0;font:15px "IBM Plex Sans",sans-serif}.search:focus{border-color:#5d5750;box-shadow:0 0 0 2px rgba(93,87,80,.12)}.random{height:42px;border:1px solid #5d5750;border-radius:2px;background:#252321;color:#fff;padding:0 14px;cursor:pointer;font:14px "IBM Plex Sans",sans-serif}.chips{display:flex;gap:7px;overflow:auto;padding-top:10px;scrollbar-width:thin}.chip{flex:0 0 auto;border:1px solid #aaa298;border-radius:999px;background:transparent;color:#393633;padding:6px 10px;cursor:pointer;font:12px "IBM Plex Sans",sans-serif}.chip[aria-pressed="true"]{border-color:#252321;background:#252321;color:#fff}
    main{max-width:var(--max);margin:auto;padding:27px 20px 70px}.result{margin:0 0 18px;color:var(--muted);font:13px "IBM Plex Sans",sans-serif}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:24px}.card{overflow:hidden;border:1px solid var(--line);border-radius:3px;background:var(--card)}.card-media{padding:10px 10px 0}.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.media-grid.single{grid-template-columns:1fr}.media-grid.three figure:first-child{grid-row:span 2}.media-grid figure{position:relative;margin:0;min-height:120px;overflow:hidden;background:#ddd7ce}.media-grid.single figure{min-height:225px}.media-grid img{display:block;width:100%;height:100%;min-height:120px;aspect-ratio:4/3;object-fit:cover}.media-grid.single img{aspect-ratio:16/10}.media-grid .image-link{display:block;height:100%;color:inherit}.image-status{display:grid;min-height:150px;place-items:center;padding:12px;color:#6c665e;text-align:center;font:12px "IBM Plex Sans",sans-serif}.media-grid figcaption{position:absolute;inset:auto 0 0;padding:18px 7px 6px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font:10px/1.25 "IBM Plex Sans",sans-serif;opacity:0;transition:opacity .15s}.media-grid figure:hover figcaption,.media-grid figure:focus-within figcaption{opacity:1}.youtube{grid-column:1/-1}.youtube iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#111}.video-link{display:block;padding:7px 2px 2px;color:#625d56;text-decoration:none;font:11px "IBM Plex Sans",sans-serif}.card-open{display:block;width:100%;border:0;background:transparent;padding:18px 18px 20px;color:inherit;text-align:left;cursor:pointer}.card-open:focus-visible{outline:3px solid #875d57;outline-offset:-3px}.category{display:block;margin-bottom:8px;color:var(--accent);font:600 11px/1.35 "IBM Plex Sans",sans-serif;letter-spacing:.04em;text-transform:uppercase}.card h2{margin:0;font:600 clamp(23px,2.4vw,31px)/1.14 "Source Serif 4",serif}.card h2.quote{font-style:italic;font-weight:400;line-height:1.3}.summary{margin:10px 0 0;color:#494641;font-size:15px;line-height:1.52}.byline{display:block;margin-top:10px;color:var(--muted);font:13px "IBM Plex Sans",sans-serif}.more{display:block;margin:34px auto 0;border:1px solid #5d5750;border-radius:2px;background:#fffdf9;color:#252321;padding:10px 19px;cursor:pointer;font:14px "IBM Plex Sans",sans-serif}.more[hidden]{display:none}
    dialog{max-width:none;max-height:none;border:0;padding:0;background:transparent}dialog::backdrop{background:rgba(20,18,16,.76)}.sheet{position:relative;width:min(850px,calc(100vw - 18px));max-height:92vh;overflow:auto;border-radius:4px;background:#fffdf9;box-shadow:0 24px 80px rgba(0,0,0,.35);padding:28px clamp(18px,5vw,48px) 42px}.close{position:sticky;z-index:2;float:right;top:0;width:40px;height:40px;margin:-12px -24px 4px 18px;border:1px solid var(--line);border-radius:50%;background:#fffdf9;color:#252321;cursor:pointer;font:25px/1 "IBM Plex Sans",sans-serif}.detail-category{margin:3px 0 10px;color:var(--accent);font:600 12px "IBM Plex Sans",sans-serif;text-transform:uppercase;letter-spacing:.04em}.sheet h2{margin:0 0 22px;font:600 clamp(30px,6vw,48px)/1.12 "Source Serif 4",serif}.detail-summary{margin:-10px 0 24px;color:#494641;font-size:19px;line-height:1.5}.detail-text{font-size:17px;line-height:1.72}.detail-text p{margin:0 0 17px}.detail-media{margin:5px 0 26px}.original{margin:24px 0;padding:18px 20px;border-left:3px solid #8b2f28;background:#f3eee6}.original-label{margin:0 0 8px;color:#69645d;font:12px "IBM Plex Sans",sans-serif}.original blockquote{margin:0;font-size:16px;line-height:1.65}.works{margin:21px 0;padding-left:22px}.works li{margin:7px 0}.sources{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}.sources h3{margin:0 0 9px;font:600 13px "IBM Plex Sans",sans-serif}.sources ul{margin:0;padding-left:20px}.sources li{margin:7px 0;color:#4d4944;font:13px/1.45 "IBM Plex Sans",sans-serif}.sources a{color:#74332d}
    @media(max-width:600px){header{padding-top:30px}.controls-inner,main,header{padding-inline:12px}.grid{grid-template-columns:1fr;gap:18px}.sheet{padding-inline:18px}.close{margin-right:-8px}.media-grid.single figure{min-height:190px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.media-grid figcaption{transition:none}}
  </style>
</head>
<body>
  <header><h1>Kartei</h1><p class="count" id="count"></p></header>
  <nav class="controls" aria-label="Suche und Kategorien"><div class="controls-inner"><div class="search-row"><input class="search" id="search" type="search" placeholder="Suchen" aria-label="Karten durchsuchen" autocomplete="off"><button class="random" id="random" type="button">Zufall</button></div><div class="chips" id="chips"></div></div></nav>
  <main><p class="result" id="result" aria-live="polite"></p><section class="grid" id="grid" aria-label="Karten"></section><button class="more" id="more" type="button">Mehr</button></main>
  <dialog id="detailDialog" aria-labelledby="detailTitle"><article class="sheet"><button class="close" type="button" aria-label="Schließen">×</button><div id="detail"></div></article></dialog>
  <script src="media-map.js"></script>
  <script src="cards.js"></script>
  <script>
    (() => {
      "use strict";
      const cards=Array.isArray(window.KARTEN)?window.KARTEN:[];
      const state={category:"Alle",query:"",shown:18};
      const imageCache=new Map();
      const grid=document.querySelector("#grid"),chips=document.querySelector("#chips"),search=document.querySelector("#search"),result=document.querySelector("#result"),more=document.querySelector("#more"),dialog=document.querySelector("#detailDialog"),detail=document.querySelector("#detail");
      const categories=[...new Set(cards.map(card=>card.category))];
      document.querySelector("#count").textContent=`${cards.length} Karten · ${categories.length} Kategorien`;
      function normalize(value){return String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
      function filtered(){const query=normalize(state.query);return cards.filter(card=>(state.category==="Alle"||card.category===state.category)&&(!query||normalize([card.title,card.byline,card.summary,...card.detail].join(" ")).includes(query)))}
      function el(name,className,text){const node=document.createElement(name);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
      async function commonsInfo(item){
        if(item.type==="image")return{src:item.src,href:item.href,credit:item.credit||"Bildquelle"};
        if(item.remote?.src)return{...item.remote,credit:"Wikimedia Commons"};
        const key=item.file?`file:${item.file}`:`query:${item.query}`;if(imageCache.has(key))return imageCache.get(key);
        const params=new URLSearchParams({action:"query",format:"json",origin:"*",prop:"imageinfo",iiprop:"url",iiurlwidth:"1200"});
        if(item.file)params.set("titles",item.file.startsWith("File:")?item.file:`File:${item.file}`);else{params.set("generator","search");params.set("gsrnamespace","6");params.set("gsrlimit","1");params.set("gsrsearch",item.query)}
        const promise=fetch(`https://commons.wikimedia.org/w/api.php?${params}`).then(response=>{if(!response.ok)throw new Error(String(response.status));return response.json()}).then(data=>{const pages=Object.values(data.query?.pages||{}).sort((a,b)=>(a.index||0)-(b.index||0));const page=pages.find(entry=>entry.imageinfo?.[0]);if(!page)throw new Error("Bild fehlt");const info=page.imageinfo[0];return{src:info.thumburl||info.url,href:info.descriptionurl||`https://commons.wikimedia.org/wiki/${encodeURIComponent(page.title)}`}});
        imageCache.set(key,promise);return promise;
      }
      function youtubeFigure(item){const figure=el("figure","youtube");const iframe=document.createElement("iframe");iframe.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(item.id)}?rel=0`;iframe.title=item.caption||"YouTube-Video";iframe.loading="lazy";iframe.referrerPolicy="strict-origin-when-cross-origin";iframe.allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share";iframe.allowFullscreen=true;figure.append(iframe);const link=el("a","video-link",`${item.caption||"Video"} · YouTube öffnen`);link.href=`https://www.youtube.com/watch?v=${encodeURIComponent(item.id)}`;link.target="_blank";link.rel="noopener noreferrer";figure.append(link);return figure}
      function imageFigure(item){const figure=document.createElement("figure");const link=el("a","image-link");link.target="_blank";link.rel="noopener noreferrer";link.setAttribute("aria-label",`${item.caption} – Bildquelle öffnen`);const status=el("span","image-status","Bild wird geladen");link.append(status);figure.append(link);const caption=el("figcaption","",item.caption);figure.append(caption);commonsInfo(item).then(info=>{const img=document.createElement("img");img.src=info.src;img.alt=item.alt||item.caption;img.loading="lazy";img.decoding="async";link.href=info.href;link.replaceChildren(img);caption.textContent=`${item.caption} · ${info.credit||"Wikimedia Commons"}`}).catch(()=>{status.textContent="Bild fehlt";link.href=item.href||`https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(item.query||item.file)}&title=Special:MediaSearch&type=image`});return figure}
      function mediaGrid(card,className=""){const items=card.media||[];const wrap=el("div",`media-grid ${items.length===1?"single":items.length===3?"three":""} ${className}`.trim());items.forEach(item=>wrap.append(item.type==="youtube"?youtubeFigure(item):imageFigure(item)));return wrap}
      function cardElement(card){const article=el("article","card");const media=el("div","card-media");media.append(mediaGrid(card));article.append(media);const button=el("button","card-open");button.type="button";if(card.category!=="Erste Sätze großer Romane")button.append(el("span","category",card.category));button.append(el("h2",card.kind==="quote"?"quote":"",card.title));if(card.summary)button.append(el("p","summary",card.summary));if(card.byline)button.append(el("span","byline",card.byline));button.addEventListener("click",()=>openDetail(card));article.append(button);return article}
      function openDetail(card){detail.replaceChildren();detail.append(el("p","detail-category",card.category));const title=el("h2","",card.title);title.id="detailTitle";detail.append(title);if(card.summary)detail.append(el("p","detail-summary",card.summary));const media=el("div","detail-media");media.append(mediaGrid(card));detail.append(media);if(card.original){const box=el("section","original");box.append(el("p","original-label",card.original.label));box.append(el("blockquote","",card.original.text));detail.append(box)}const body=el("div","detail-text");card.detail.forEach(paragraph=>body.append(el("p","",paragraph)));detail.append(body);if(card.works?.length){const list=el("ol","works");card.works.forEach(work=>list.append(el("li","",work)));detail.append(list)}if(card.sources?.length){const sources=el("section","sources");sources.append(el("h3","","Quellen"));const list=document.createElement("ul");card.sources.forEach(source=>{const li=document.createElement("li");const a=el("a","",source.label);a.href=source.url;a.target="_blank";a.rel="noopener noreferrer";li.append(a);list.append(li)});sources.append(list);detail.append(sources)}dialog.showModal();document.body.classList.add("dialog-open")}
      function renderChips(){chips.replaceChildren();["Alle",...categories].forEach(category=>{const button=el("button","chip",category);button.type="button";button.setAttribute("aria-pressed",String(category===state.category));button.addEventListener("click",()=>{state.category=category;state.shown=18;renderChips();render()});chips.append(button)})}
      function render(){const list=filtered();grid.replaceChildren(...list.slice(0,state.shown).map(cardElement));result.textContent=`${list.length} Karten`;more.hidden=state.shown>=list.length}
      search.addEventListener("input",()=>{state.query=search.value;state.shown=18;render()});more.addEventListener("click",()=>{state.shown+=18;render()});document.querySelector("#random").addEventListener("click",()=>{const list=filtered();if(list.length)openDetail(list[Math.floor(Math.random()*list.length)])});dialog.querySelector(".close").addEventListener("click",()=>dialog.close());dialog.addEventListener("click",event=>{if(event.target===dialog)dialog.close()});dialog.addEventListener("close",()=>document.body.classList.remove("dialog-open"));renderChips();render();
    })();
  </script>
</body>
</html>
