  <dialog id="feedbackDialog" aria-labelledby="feedbackTitle"><article class="feedback-sheet"><button class="close feedback-close" type="button" aria-label="Schließen">×</button><h2 id="feedbackTitle">Gespeichertes Feedback</h2><p class="feedback-explanation">Die Einträge liegen in diesem Browser. „Kopieren“ erzeugt ein Markdown-Dokument, das hier in den Chat eingefügt werden kann. „Teilen“ öffnet die Freigabeziele des Geräts; Google Keep erscheint dort nur, wenn das Gerät es anbietet.</p><ul class="feedback-list" id="feedbackList"></ul><div class="feedback-actions"><button class="primary" id="copyFeedback" type="button">Kopieren</button><button id="downloadFeedback" type="button">Markdown laden</button><button id="shareFeedback" type="button">Teilen</button><button id="clearFeedback" type="button">Einträge löschen</button></div><p class="feedback-explanation" id="feedbackStatus" aria-live="polite"></p></article></dialog>

  <script>
    (() => {
      "use strict";
      const archivedCategories=new Set(["Gute Gags","Seltene und geniale Lifehacks"]);
      const rawCards=(Array.isArray(window.KARTEN)?window.KARTEN:[]).filter(card=>!archivedCategories.has(card.category));
      function shuffled(source){const list=[...source];for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list}
      function mixedCards(source){const names=shuffled([...new Set(source.map(card=>card.category))]),groups=new Map(names.map(name=>[name,shuffled(source.filter(card=>card.category===name))])),mixed=[];for(let row=0;mixed.length<source.length;row++)shuffled(names.filter(name=>groups.get(name)[row])).forEach(name=>mixed.push(groups.get(name)[row]));return mixed}
      const cards=mixedCards(rawCards);
      const state={category:"Alle",query:"",shown:18};
      const imageCache=new Map(),originalTextCache=new Map(),wikipediaTextCache=new Map(),FEEDBACK_KEY="karten.feedback.v1";
      let commonsNextAt=Date.now();
      let currentRatingCard=null,currentVote="down";
      const grid=document.querySelector("#grid"),chips=document.querySelector("#chips"),search=document.querySelector("#search"),categorySelect=document.querySelector("#categorySelect"),result=document.querySelector("#result"),more=document.querySelector("#more"),dialog=document.querySelector("#detailDialog"),detail=document.querySelector("#detail"),ratingDialog=document.querySelector("#ratingDialog"),feedbackDialog=document.querySelector("#feedbackDialog");

      function normalize(value){return String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
      function filtered(){const query=normalize(state.query);return cards.filter(card=>(state.category==="Alle"||card.category===state.category)&&(!query||normalize([card.title,card.byline,card.summary,...card.detail,JSON.stringify(card.vocabulary||{})].join(" ")).includes(query)))}
      function el(name,className,text){const node=document.createElement(name);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
      function commonsFetch(url,attempt=0){const delay=Math.max(0,commonsNextAt-Date.now());commonsNextAt=Math.max(Date.now(),commonsNextAt)+300;return new Promise(resolve=>setTimeout(resolve,delay)).then(()=>fetch(url)).then(async response=>{const body=await response.text();if(!response.ok)throw new Error(String(response.status));try{return JSON.parse(body)}catch{throw new Error("Commons antwortet vorübergehend ohne Bilddaten")}}).catch(error=>{if(attempt>=2)throw error;return new Promise(resolve=>setTimeout(resolve,1800*(attempt+1))).then(()=>commonsFetch(url,attempt+1))})}
      async function commonsInfo(item){
        if(item.type==="image")return{src:item.src,href:item.href,credit:item.credit||"Bildquelle"};
        if(item.remote?.src)return{...item.remote,credit:"Wikimedia Commons"};
        const key=item.file?`file:${item.file}`:`query:${item.query}`;if(imageCache.has(key))return imageCache.get(key);
        const params=new URLSearchParams({action:"query",format:"json",origin:"*",prop:"imageinfo",iiprop:"url",iiurlwidth:"1200"});
        if(item.file)params.set("titles",item.file.startsWith("File:")?item.file:`File:${item.file}`);else{params.set("generator","search");params.set("gsrnamespace","6");params.set("gsrlimit","1");params.set("gsrsearch",item.query)}
        const promise=commonsFetch(`https://commons.wikimedia.org/w/api.php?${params}`).then(data=>{const pages=Object.values(data.query?.pages||{}).sort((a,b)=>(a.index||0)-(b.index||0));const page=pages.find(entry=>entry.imageinfo?.[0]);if(!page)throw new Error("Bild fehlt");const info=page.imageinfo[0];return{src:info.thumburl||info.url,href:info.descriptionurl||`https://commons.wikimedia.org/wiki/${encodeURIComponent(page.title)}`}}).catch(error=>{imageCache.delete(key);throw error});
        imageCache.set(key,promise);return promise;
      }
      function youtubeFigure(item){const figure=el("figure","youtube"),iframe=document.createElement("iframe");iframe.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(item.id)}?rel=0`;iframe.title=item.caption||"YouTube-Video";iframe.loading="lazy";iframe.referrerPolicy="strict-origin-when-cross-origin";iframe.allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share";iframe.allowFullscreen=true;figure.append(iframe);const link=el("a","video-link",`${item.caption||"Video"} · YouTube öffnen`);link.href=`https://www.youtube.com/watch?v=${encodeURIComponent(item.id)}`;link.target="_blank";link.rel="noopener noreferrer";figure.append(link);return figure}
      function syncMediaGrid(wrap){const count=wrap.children.length;wrap.classList.toggle("single",count===1);wrap.classList.toggle("three",count===3);if(!count){const host=wrap.parentElement;if(host?.classList.contains("card-media")||host?.classList.contains("detail-media"))host.remove();else wrap.remove()}}
      function discardFigure(figure){const wrap=figure.parentElement;figure.remove();if(wrap?.classList.contains("media-grid"))syncMediaGrid(wrap)}
      function imageFigure(item){const figure=document.createElement("figure");const link=el("a","image-link");link.target="_blank";link.rel="noopener noreferrer";link.setAttribute("aria-label",`${item.caption} – Bildquelle öffnen`);const status=el("span","image-status","Bild wird geladen");link.append(status);figure.append(link);const caption=el("figcaption","",item.caption);figure.append(caption);commonsInfo(item).then(info=>{const img=document.createElement("img");img.alt=item.alt||item.caption;img.loading="lazy";img.decoding="async";img.addEventListener("error",()=>discardFigure(figure),{once:true});link.href=info.href;link.replaceChildren(img);caption.textContent=`${item.caption} · ${info.credit||"Wikimedia Commons"}`;img.src=info.src}).catch(()=>discardFigure(figure));return figure}
      function mediaGrid(card,className=""){const items=card.media||[];const wrap=el("div",`media-grid ${className}`.trim());items.forEach(item=>wrap.append(item.type==="youtube"?youtubeFigure(item):imageFigure(item)));syncMediaGrid(wrap);return wrap}
      function cardElement(card){const visualOnly=card.kind==="gif",article=el("article",`card${visualOnly?" gif-card":""}`);const media=el("div","card-media");media.append(mediaGrid(card));article.append(media);const aphorism=card.category==="Aphorismen",staticCard=aphorism||visualOnly,opener=el(staticCard?"div":"button",`card-open${aphorism?" aphorism-card":""}`);if(!staticCard)opener.type="button";if(!aphorism&&card.category!=="Erste Sätze großer Romane")opener.append(el("span","category",card.category));opener.append(el("h2",card.kind==="quote"?"quote":"",card.title));if(card.summary)opener.append(el("p","summary",card.summary));if(card.byline)opener.append(el("span","byline",card.byline));if(!staticCard)opener.addEventListener("click",()=>openDetail(card));article.append(opener,ratingSection(card));return article}
      function wikiText(html){const doc=new DOMParser().parseFromString(html,"text/html"),root=doc.querySelector(".pagetext")||doc.querySelector(".mw-parser-output")||doc.body;root.querySelectorAll("style,script,.mw-editsection,.prp-page-qualityheader,.wst-rh,.ws-noexport,.noprint,table").forEach(node=>node.remove());return root.innerText}
      async function loadWikiPage(language,page){const url=`https://${language}.wikisource.org/w/api.php?action=parse&page=${encodeURIComponent(page)}&prop=text&format=json&origin=*&redirects=1`;const response=await fetch(url);if(!response.ok)throw new Error(String(response.status));const data=await response.json();if(!data.parse?.text?.["*"])throw new Error("Wikisource-Seite fehlt");return wikiText(data.parse.text["*"])}
      async function loadWikipedia(wiki){const key=JSON.stringify(wiki);if(wikipediaTextCache.has(key))return wikipediaTextCache.get(key);const promise=(async()=>{const language=wiki.language||"de",url=`https://${language}.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(wiki.page)}&prop=text&format=json&origin=*&redirects=1`,response=await fetch(url);if(!response.ok)throw new Error(String(response.status));const data=await response.json();if(!data.parse?.text?.["*"])throw new Error("Wikipedia-Seite fehlt");const doc=new DOMParser().parseFromString(data.parse.text["*"],"text/html"),root=doc.querySelector(".mw-parser-output")||doc.body;root.querySelectorAll("style,script,sup.reference,.mw-editsection,.coordinates,.navbox,.hatnote,.shortdescription,.metadata").forEach(node=>node.remove());const paragraphs=[...root.querySelectorAll("p")].filter(node=>node.textContent.trim().length>35),firstHeading=root.querySelector("h2"),lead=paragraphs.filter(node=>!firstHeading||(node.compareDocumentPosition(firstHeading)&Node.DOCUMENT_POSITION_FOLLOWING));let selected;if(Array.isArray(wiki.paragraphs)){selected=[...new Set([...lead,...wiki.paragraphs.map(index=>paragraphs[index]).filter(Boolean)])]}else{const amount=Math.max(lead.length,wiki.count||0,1);selected=paragraphs.slice(0,amount)}const texts=selected.map(node=>node.textContent.replace(/\s+/g," ").trim());if(!texts.length)throw new Error("Wikipedia-Einleitung fehlt");return texts})();wikipediaTextCache.set(key,promise);return promise}
      function wikipediaSection(wiki){const body=el("div","detail-text"),status=el("p","source-status","Text wird geladen …");body.append(status);loadWikipedia(wiki).then(paragraphs=>body.replaceChildren(...paragraphs.map(paragraph=>el("p","",paragraph)))).catch(error=>{status.textContent=`Text konnte nicht geladen werden: ${error.message}`});return body}
      function markerPosition(text,marker,from,last,flexible){if(!flexible)return last?text.lastIndexOf(marker):text.indexOf(marker,from);const pattern=marker.trim().split(/\s+/).map(part=>part.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("\\s+");const matches=[...text.slice(from).matchAll(new RegExp(pattern,"g"))];const match=last?matches.at(-1):matches[0];return match?from+match.index:-1}
      function prepareOriginalText(text,remote){text=text.replace(/\r/g,"");if(remote.ocr)text=text.replace(/([A-Za-zÀ-ž])-\s*\n\s*([a-zà-ž])/g,"$1$2");if(remote.start){const start=markerPosition(text,remote.start,0,remote.startLast,remote.flexibleMarkers);if(start<0)throw new Error("Anfangsmarke fehlt");const end=remote.end?markerPosition(text,remote.end,start+1,false,remote.flexibleMarkers):text.length;if(end<0)throw new Error("Endmarke fehlt");text=text.slice(start,end)}for(const [from,to] of remote.replacements||[])text=text.split(from).join(to);if(remote.stripPageMarkers)text=text.replace(/\s*\[\d+\]\s*/g," ");text=text.replace(/^\s*(?:\*\s*){3,}$/gm,"").replace(/^\s*\[Illustration:[^\n]*\]\s*$/gm,"");if(remote.aozora)text=text.replace(/［＃[^］]*］/g,"").replace(/｜/g,"").replace(/《([^》]+)》/g,"（$1）");if(remote.reflow)text=text.replace(/([^\n])\n(?!\n)/g,"$1 ");return text.replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").replace(/[ \t]{2,}/g," ").trim()}
      async function fetchOriginalText(remote){const key=JSON.stringify(remote);if(originalTextCache.has(key))return originalTextCache.get(key);const promise=(async()=>{let text;if(remote.wikiPage)text=await loadWikiPage(remote.wikiLanguage||"en",remote.wikiPage);else if(remote.wikiPages)text=(await Promise.all(remote.wikiPages.map(page=>loadWikiPage(remote.wikiLanguage||"en",page)))).join("\n\n");else{const response=await fetch(remote.url);if(!response.ok)throw new Error(String(response.status));text=new TextDecoder(remote.encoding||"utf-8").decode(await response.arrayBuffer())}text=prepareOriginalText(text,remote);if(text.length<250)throw new Error("Textausschnitt ist zu kurz");return text})();originalTextCache.set(key,promise);return promise}
      function originalSection(original){const box=el("section","original");box.append(el("p","original-label",original.label));if(original.remote){const status=el("p","source-status",original.loadingText||"Der vollständige Originaltext wird aus der Onlinequelle geladen …");box.append(status);fetchOriginalText(original.remote).then(text=>{status.replaceWith(el("div","source-text",text))}).catch(error=>{status.textContent=`${original.errorLabel||"Originaltext"} konnte nicht geladen werden: ${error.message}. Die Quellenadresse steht darunter.`})}else if(original.text){box.append(el("blockquote","",original.text))}if(original.source){const link=el("a","original-source","Digitalisat der Quelle öffnen");link.href=original.source;link.target="_blank";link.rel="noopener noreferrer";box.append(link)}const remote=original.remote,fetchUrl=remote?.url||(remote?.wikiPage?`https://${remote.wikiLanguage||"en"}.wikisource.org/wiki/${encodeURIComponent(remote.wikiPage).replace(/%2F/g,"/")}`:remote?.wikiPages?.length?`https://${remote.wikiLanguage||"en"}.wikisource.org/wiki/${encodeURIComponent(remote.wikiPages[0]).replace(/%2F/g,"/")}`:null);if(fetchUrl){const link=el("a","original-source",`Geladene Transkription öffnen · ${remote.fetchLabel||"Textquelle"}`);link.href=fetchUrl;link.target="_blank";link.rel="noopener noreferrer";box.append(link)}return box}
      function writingSourceSection(source){const section=originalSection({...source,loadingText:"Der Quellenwortlaut wird aus der Onlinequelle geladen …",errorLabel:"Quellenwortlaut"});section.classList.add("writing-source");return section}
      function vocabularySection(vocabulary){const section=el("section","vocabulary");section.append(el("p","vocab-meta",[vocabulary.pronunciation,vocabulary.register].filter(Boolean).join(" · ")));section.append(el("p","vocab-meaning",vocabulary.meaning));const examples=el("div","vocab-examples");vocabulary.examples.forEach(example=>{const item=el("div","vocab-example"),english=el("p","example-en",example.english),german=el("p","example-de",example.german);english.lang="en";item.append(english,german);examples.append(item)});section.append(examples);return section}
      function languageInfoSection(rows){const table=el("table","language-info"),body=document.createElement("tbody");for(const [label,value] of rows){const row=document.createElement("tr"),heading=el("th","",label),cell=el("td","",value);heading.scope="row";row.append(heading,cell);body.append(row)}table.append(body);return table}
      function googleSearchSection(card){const section=el("section","google-search"),form=document.createElement("form"),input=document.createElement("input"),button=el("button","","Suchen");section.append(el("h3","","Bei Google weitersuchen"));form.action="https://www.google.com/search";form.method="get";form.target="_blank";form.rel="noopener noreferrer";form.setAttribute("role","search");input.type="search";input.name="q";input.value=card.searchTerm||`${card.title} ${card.category}`;input.setAttribute("aria-label","Google-Suchbegriff");button.type="submit";form.append(input,button);section.append(form);return section}
      function readFeedback(){try{const value=JSON.parse(localStorage.getItem(FEEDBACK_KEY)||"[]");return Array.isArray(value)?value:[]}catch{return[]}}
      function writeFeedback(entries){try{localStorage.setItem(FEEDBACK_KEY,JSON.stringify(entries));return true}catch{return false}}
      function updateFeedbackCount(){const amount=readFeedback().length;document.querySelector("#feedbackCount").textContent=amount;document.querySelector("#detailFeedbackCount").textContent=amount}
      function feedbackMarkdown(){const entries=readFeedback();const lines=["# Kartenfeedback","",`Export: ${new Date().toLocaleString("de-DE")}`,""];for(const entry of entries){lines.push(`## ${entry.vote==="up"?"▲":"▼"} ${entry.title}`,"",`- Kategorie: ${entry.category}`,`- Bewertung: ${entry.vote==="up"?"positiv":"negativ"}`,`- Zeitpunkt: ${new Date(entry.createdAt).toLocaleString("de-DE")}`);if(entry.reasons?.length)lines.push(`- Kritik: ${entry.reasons.join("; ")}`);if(entry.note)lines.push(`- Notiz: ${entry.note}`);if(entry.summary)lines.push(`- Außentext: ${entry.summary}`);if(entry.sources?.length)lines.push(`- Quellen: ${entry.sources.join(" · ")}`);lines.push("")}return lines.join("\n")}
      function ratingSection(card){const section=el("section","rating"),label=el("span","rating-label","Diese Karte bewerten"),up=el("button","vote","▲"),down=el("button","vote","▼");up.type=down.type="button";up.title="Gut";down.title="Kritik";up.setAttribute("aria-label","Karte positiv bewerten");down.setAttribute("aria-label","Karte negativ bewerten");up.addEventListener("click",()=>openRating(card,"up"));down.addEventListener("click",()=>openRating(card,"down"));section.append(label,up,down);return section}
      function openRating(card,vote){currentRatingCard=card;currentVote=vote;document.querySelector("#ratingTitle").textContent=vote==="up"?"Positive Bewertung":"Kritik an der Karte";document.querySelector("#ratingCard").textContent=`${card.category} · ${card.title}`;const reasons=document.querySelector("#negativeReasons");reasons.hidden=vote==="up";reasons.querySelectorAll("input").forEach(input=>input.checked=false);document.querySelector("#ratingNoteLabel").textContent=vote==="up"?"Was sollte so bleiben?":"Weitere Kritik";document.querySelector("#ratingNote").value="";ratingDialog.showModal()}
      function saveRating(){if(!currentRatingCard)return;const reasons=currentVote==="down"?[...document.querySelectorAll("#negativeReasons input:checked")].map(input=>input.value):[],note=document.querySelector("#ratingNote").value.trim(),entries=readFeedback();entries.push({id:globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`,title:currentRatingCard.title,category:currentRatingCard.category,summary:currentRatingCard.summary||"",sources:(currentRatingCard.sources||[]).map(source=>source.url),vote:currentVote,reasons,note,createdAt:new Date().toISOString()});if(writeFeedback(entries)){ratingDialog.close();updateFeedbackCount()}else alert("Der Browser hat das Speichern abgelehnt.")}
      function renderFeedbackList(){const list=document.querySelector("#feedbackList"),entries=readFeedback();list.replaceChildren();if(!entries.length){list.append(el("li","feedback-empty","Noch kein Feedback gespeichert."));return}for(const entry of [...entries].reverse()){const item=document.createElement("li");item.append(el("strong","",`${entry.vote==="up"?"▲":"▼"} ${entry.title}`),document.createTextNode(entry.reasons?.length?entry.reasons.join(" · "):entry.note||"Ohne Zusatz"));list.append(item)}}
      function openFeedbackHub(){renderFeedbackList();document.querySelector("#feedbackStatus").textContent="";feedbackDialog.showModal()}
      async function copyFeedback(){const text=feedbackMarkdown();try{await navigator.clipboard.writeText(text)}catch{const field=document.createElement("textarea");field.value=text;document.body.append(field);field.select();document.execCommand("copy");field.remove()}document.querySelector("#feedbackStatus").textContent="Feedback wurde kopiert."}
      function downloadFeedback(){const blob=new Blob([feedbackMarkdown()],{type:"text/markdown;charset=utf-8"}),link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download=`kartenfeedback-${new Date().toISOString().slice(0,10)}.md`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
      async function shareFeedback(){if(!navigator.share){await copyFeedback();document.querySelector("#feedbackStatus").textContent="Eine Teilen-Funktion ist hier nicht verfügbar. Das Feedback wurde kopiert.";return}try{await navigator.share({title:"Kartenfeedback",text:feedbackMarkdown()})}catch(error){if(error.name!=="AbortError")document.querySelector("#feedbackStatus").textContent="Das Teilen ist fehlgeschlagen."}}
      function openDetail(card){const sheet=dialog.querySelector(".sheet");dialog.scrollTop=0;sheet.scrollTop=0;detail.replaceChildren();detail.append(el("p","detail-category",card.category));const title=el("h2","",card.title);title.id="detailTitle";detail.append(title);if(card.summary)detail.append(el("p","detail-summary",card.summary));const media=el("div","detail-media");media.append(mediaGrid(card));detail.append(media);if(card.languageInfo)detail.append(languageInfoSection(card.languageInfo));if(card.original)detail.append(originalSection(card.original));if(card.detail?.length){const body=el("div","detail-text");card.detail.forEach(paragraph=>body.append(el("p","",paragraph)));detail.append(body)}if(card.vocabulary)detail.append(vocabularySection(card.vocabulary));if(card.wiki)detail.append(wikipediaSection(card.wiki));if(card.writingSource)detail.append(writingSourceSection(card.writingSource));if(card.works?.length){const list=el("ol","works");card.works.forEach(work=>list.append(el("li","",work)));detail.append(list)}if(card.sources?.length){const sources=el("section","sources");sources.append(el("h3","","Quellen"));const list=document.createElement("ul");card.sources.forEach(source=>{const li=document.createElement("li");const a=el("a","",source.label);a.href=source.url;a.target="_blank";a.rel="noopener noreferrer";li.append(a);list.append(li)});sources.append(list);detail.append(sources)}detail.append(googleSearchSection(card),ratingSection(card));dialog.showModal();requestAnimationFrame(()=>{dialog.scrollTop=0;sheet.scrollTop=0});document.body.classList.add("dialog-open")}
      function selectCategory(category){state.category=category;state.shown=18;renderChips();render()}
      function renderChips(){chips.replaceChildren();["Alle",...categories].forEach(category=>{const button=el("button","chip",category);button.type="button";button.setAttribute("aria-pressed",String(category===state.category));button.addEventListener("click",()=>selectCategory(category));chips.append(button)});categorySelect.value=state.category}
      function render(reset=true){const list=filtered();if(reset)grid.replaceChildren();const from=grid.children.length,to=Math.min(state.shown,list.length);if(from<to)grid.append(...list.slice(from,to).map(cardElement));result.textContent=`${list.length} Karten`;more.hidden=to>=list.length}
      function loadMore(){const total=filtered().length;if(state.shown>=total)return;state.shown=Math.min(state.shown+18,total);render(false)}
      categorySelect.replaceChildren(...["Alle",...categories].map(category=>{const option=el("option","",category);option.value=category;return option}));
      search.addEventListener("input",()=>{state.query=search.value;state.shown=18;render()});categorySelect.addEventListener("change",()=>selectCategory(categorySelect.value));more.addEventListener("click",loadMore);document.querySelector("#random").addEventListener("click",()=>{const list=filtered();if(list.length)openDetail(list[Math.floor(Math.random()*list.length)])});dialog.querySelector(".close").addEventListener("click",()=>dialog.close());dialog.addEventListener("click",event=>{if(event.target===dialog)dialog.close()});dialog.addEventListener("close",()=>document.body.classList.remove("dialog-open"));
      document.querySelector("#saveRating").addEventListener("click",saveRating);document.querySelector(".cancel-rating").addEventListener("click",()=>ratingDialog.close());document.querySelector(".rating-close").addEventListener("click",()=>ratingDialog.close());ratingDialog.addEventListener("click",event=>{if(event.target===ratingDialog)ratingDialog.close()});
      document.querySelector("#feedbackHubButton").addEventListener("click",openFeedbackHub);document.querySelector("#detailFeedbackButton").addEventListener("click",()=>{dialog.close();setTimeout(openFeedbackHub,0)});document.querySelector(".feedback-close").addEventListener("click",()=>feedbackDialog.close());feedbackDialog.addEventListener("click",event=>{if(event.target===feedbackDialog)feedbackDialog.close()});document.querySelector("#copyFeedback").addEventListener("click",copyFeedback);document.querySelector("#downloadFeedback").addEventListener("click",downloadFeedback);document.querySelector("#shareFeedback").addEventListener("click",shareFeedback);document.querySelector("#clearFeedback").addEventListener("click",()=>{if(confirm("Alle gespeicherten Feedback-Einträge in diesem Browser löschen?")){writeFeedback([]);renderFeedbackList();updateFeedbackCount()}});
      if("IntersectionObserver" in window){const loader=new IntersectionObserver(entries=>{if(entries.some(entry=>entry.isIntersecting))loadMore()},{rootMargin:"900px 0px"});loader.observe(more)}else window.addEventListener("scroll",()=>{if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-900)loadMore()},{passive:true});
      updateFeedbackCount();renderChips();render();
    })();
