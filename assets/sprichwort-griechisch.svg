<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <rect width="960" height="600" fill="#eee7d6"/>
  <text x="480" y="185" text-anchor="middle" fill="#263638" font-family="Georgia, serif" font-size="48">Geteiltes Leid ist halbes Leid.</text>
  <line x1="160" y1="260" x2="800" y2="260" stroke="#b64d38" stroke-width="4"/>
  <path d="M780 246l20 14-20 14z" fill="#b64d38"/>
  <text x="480" y="385" text-anchor="middle" fill="#263638" font-family="Georgia, serif" font-size="58">Γκετάϊλτες Λάϊδ ιστ ἅλμπες Λάϊδ.</text>
  <g fill="#b64d38" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">
    <text x="300" y="470">γκ = g</text>
    <text x="480" y="470">άϊ = ei</text>
    <text x="660" y="470">δ = d</text>
  </g>
</svg>
