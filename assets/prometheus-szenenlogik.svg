<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Die widersprüchliche Figurenlogik der Hammerpede-Szene</title>
  <desc id="desc">Zwei vorher gesetzte Eigenschaften führen in der Szene zu gegenteiligen Handlungen.</desc>
  <rect width="1200" height="760" fill="#eee9df"/>
  <g font-family="Arial, sans-serif" fill="#202425">
    <text x="95" y="105" font-size="34">gesetzte Fähigkeit</text><text x="735" y="105" font-size="34">Handlung in der Szene</text>
    <text x="95" y="235" font-size="39">Biologe erkennt Gefahr</text><text x="735" y="235" font-size="39">berührt Drohhaltung</text>
    <text x="95" y="500" font-size="39">Kartograf steuert Sonden</text><text x="735" y="500" font-size="39">findet keinen Ausgang</text>
  </g>
  <g stroke="#b64c35" stroke-width="10" fill="none"><path d="M505 220H685"/><path d="m655 190 35 30-35 30"/><path d="M505 485H685"/><path d="m655 455 35 30-35 30"/></g>
  <g stroke="#202425" stroke-width="6" fill="none"><path d="M160 625H1030"/><path d="M205 590V660M445 590V660M735 590V660M990 590V660"/></g>
  <text x="600" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#6d6760">Die Szene braucht neue Ursachen, damit die früheren Angaben weiter gelten.</text>
</svg>
