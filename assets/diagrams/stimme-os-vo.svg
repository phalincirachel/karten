<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430"><rect width="900" height="430" fill="#efe8d6"/><g font-family="Georgia,serif" fill="#243c40"><text x="40" y="55" font-size="29">Eine Stimme außerhalb des Bildes</text><g stroke="#243c40" stroke-width="2" fill="none"><rect x="45" y="110" width="380" height="245"/><rect x="475" y="110" width="380" height="245"/><rect x="65" y="155" width="190" height="135"/><rect x="495" y="155" width="190" height="135"/></g><g font-size="22"><text x="65" y="140">O.S. · neben dem Bildausschnitt</text><text x="495" y="140">V.O. · eine andere Erzählebene</text></g><g font-size="17"><text x="91" y="225">gefilmte Figur</text><text x="275" y="213">sprechende</text><text x="275" y="241">Figur im Raum</text><text x="520" y="225">gefilmte Figur</text><text x="710" y="213">später</text><text x="710" y="241">erzählte Stimme</text><text x="65" y="333">Sie hört die Person neben sich.</text><text x="495" y="333">Sie hört den Kommentar nicht.</text><text x="40" y="401" font-size="15">Eigene Darstellung · Grundfall; Drehbücher verwenden bei Telefonstimmen teils andere Regeln.</text></g></g></svg>
