<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <title>Drei Spiegel vor dem Objektiv: das Prinzip des Vortoskops</title>
  <rect width="900" height="540" fill="#f0e8d5"/>
  <g fill="#253c43" font-family="Georgia,serif">
    <text x="35" y="45" font-size="27">Das Vortoskop</text>
    <text x="35" y="78" font-size="17">Drei Spiegel bilden einen dreieckigen Kanal vor der Kamera.</text>
  </g>
  <g stroke="#34525c" stroke-width="10" fill="#bbc9c3">
    <path d="M80 310 185 130 290 310Z"/>
    <path d="M400 325 520 117 640 325Z" fill="none"/>
  </g>
  <g stroke="#8d7751" stroke-width="2" stroke-dasharray="6 5">
    <path d="M80 310 400 325 M185 130 520 117 M290 310 640 325"/>
  </g>
  <g stroke="#a54a34" stroke-width="3" fill="none">
    <path d="M735 180 590 247 490 170 447 244 186 245"/>
  </g>
  <g fill="#253c43" font-family="Georgia,serif" font-size="19">
    <text x="75" y="358">Blick in den Kanal</text>
    <text x="420" y="365">Spiegelflächen</text>
    <text x="665" y="222">Motiv</text>
    <text x="35" y="425">Eine Reflexion zeigt einen anderen Ausschnitt desselben Gegenstands.</text>
    <text x="35" y="460">Beim Drehen des Aufsatzes ändert sich die Anordnung im Sucher.</text>
    <text x="35" y="505" font-size="14">Eigene schematische Darstellung nach dem beschriebenen Aufnahmeverfahren Coburns.</text>
  </g>
</svg>
