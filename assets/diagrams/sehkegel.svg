<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#a34830"/></marker></defs><rect width="900" height="440" fill="#efe8d6"/><g font-family="Georgia,serif" fill="#243c40"><text x="42" y="54" font-size="29">Euklids Sehkegel</text><text x="42" y="87" font-size="17">Ein geometrisches Modell des Sehens, um 300 v. Chr.</text><path d="M104 232Q144 192 184 232Q144 272 104 232" fill="white" stroke="#243c40" stroke-width="3"/><circle cx="150" cy="232" r="14"/><path d="M184 232L690 140M184 232L690 325M184 232L690 232" stroke="#a34830" stroke-width="3" marker-end="url(#arrow)"/><path d="M710 132V335" stroke="#243c40" stroke-width="18"/><path d="M292 213Q310 232 292 252" stroke="#607b77" stroke-width="3" fill="none"/><text x="102" y="307" font-size="21">Auge</text><text x="738" y="244" font-size="21">Gegenstand</text><text x="333" y="271" font-size="18">Sehwinkel</text><text x="42" y="388" font-size="17">Die historischen Sehstrahlen laufen vom Auge zum Gegenstand.</text><text x="42" y="416" font-size="15">Eigene Darstellung · Die Geometrie erklärt den Sehwinkel, die Strahlrichtung ist überholt.</text></g></svg>
